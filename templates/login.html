{% extends "base.html" %}{% block title %}Entrar{% endblock %}
{% block body %}
<h1>Entrar no sistema</h1>
<p class="lead">Acesso simplificado para demonstração dos perfis de colaboração, revisão e administração.</p>

<form class="card form-card" method="post" style="max-width:30rem">
  <div class="field" style="margin-top:0">
    <label for="nome">Seu nome <span class="req-tag">Obrigatório</span></label>
    <input id="nome" name="nome" required autocomplete="name" placeholder="Ex.: Gabriela">
  </div>
  <div class="field">
    <label for="perfil">Perfil de acesso</label>
    <select id="perfil" name="perfil">
      <option value="colaborador">Colaborador (criar e editar sinais)</option>
      <option value="revisor">Revisor (aprovar ou solicitar ajustes)</option>
      <option value="administrador">Administrador (auditoria e LGPD)</option>
    </select>
  </div>
  <p style="margin-top:1.3rem;margin-bottom:0">
    <button type="submit">
      <svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Entrar
    </button>
  </p>
</form>
{% endblock %}
